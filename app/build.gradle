plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

def familyHubIconSource = file('icon-source/family_hub_app_icon.b64')
def generatedFamilyHubIconResDir = file("$buildDir/generated/familyHubIconRes")
def generateFamilyHubIcon = tasks.register('generateFamilyHubIcon') {
    inputs.file(familyHubIconSource)
    outputs.file(new File(generatedFamilyHubIconResDir,
            'drawable-nodpi/family_hub_app_icon.jpg'))
    doLast {
        File drawableDir = new File(generatedFamilyHubIconResDir, 'drawable-nodpi')
        if (!drawableDir.exists() && !drawableDir.mkdirs()) {
            throw new GradleException('Unable to create generated Family Hub icon directory')
        }
        File output = new File(drawableDir, 'family_hub_app_icon.jpg')
        output.bytes = java.util.Base64.decoder.decode(
                familyHubIconSource.getText('UTF-8').trim()
        )
    }
}

android {
    namespace 'com.tridev.familyhub'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tridev.familyhub'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.4.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main {
            res.srcDir generatedFamilyHubIconResDir
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn generateFamilyHubIcon
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'

    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.google.guava:guava:33.4.8-android'

    implementation 'com.google.android.material:material:1.13.0'

    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-firestore'

    implementation 'com.google.android.gms:play-services-location:21.2.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
