name: One-time Grocery overlay opacity patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-opacity:
    if: github.event.head_commit.message == 'Apply one-time Grocery overlay opacity patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make only the Grocery overlay panel more opaque
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java')
          text = path.read_text(encoding='utf-8')

          old = '''        GradientDrawable drawable = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                  new int[]{Color.argb(236, 239, 250, 243), Color.argb(228, 255, 244, 245),
                          Color.argb(232, 238, 246, 253)});
          drawable.setCornerRadius(dp(20));
          drawable.setStroke(dp(1), Color.argb(200, 199, 213, 220));'''

          new = '''        GradientDrawable drawable = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                  new int[]{Color.argb(252, 239, 250, 243), Color.argb(250, 255, 244, 245),
                          Color.argb(252, 238, 246, 253)});
          drawable.setCornerRadius(dp(20));
          drawable.setStroke(dp(1), Color.argb(225, 199, 213, 220));'''

          if text.count(old) != 1:
              raise SystemExit('Expected Grocery overlay panelGradient block was not found exactly once; refusing to change anything.')

          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify only intended source and workflow changed
        shell: bash
        run: |
          git diff -- app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          test "$(git diff --name-only | grep -v '^app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java$' | wc -l)" -eq 0

      - name: Commit targeted opacity fix and remove this one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one_time_grocery_opacity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java .github/workflows/one_time_grocery_opacity.yml
          git commit -m "Make Grocery overlay panel more opaque"
          git push origin HEAD:main
