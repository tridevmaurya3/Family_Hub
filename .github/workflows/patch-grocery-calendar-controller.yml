name: Patch Grocery Calendar Controller

on:
  push:
    paths:
      - '.github/workflows/patch-grocery-calendar-controller.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact safe patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryListCalendarUiBinder.java')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('    private final class PageController {\n        private final Activity activity;\n',
               '    private static final class PageController {\n        private final Activity activity;\n        private final Context appContext;\n'),
              ('            return GroceryListCalendarUiBinder.this.new PageController(\n',
               '            return new PageController(\n'),
              ('            this.activity = activity;\n            this.recycler = recycler;\n',
               '            this.activity = activity;\n            this.appContext = activity.getApplicationContext();\n            this.recycler = recycler;\n'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryListCalendarUiBinder.java
          git commit -m "Fix Grocery calendar controller construction"
          git push
