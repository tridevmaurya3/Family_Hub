name: Apply Dashboard ToDo Card Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dashboard-todo-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Configure CI Android files
        shell: bash
        run: |
          printf 'sdk.dir=%s\nMAPS_API_KEY=CI_DUMMY_KEY\n' "$ANDROID_HOME" > local.properties
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"family-hub-ci","storage_bucket":"family-hub-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0000000000000000","android_client_info":{"package_name":"com.tridev.familyhub"}},"oauth_client":[],"api_key":[{"current_key":"CI_DUMMY_FIREBASE_API_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON

      - name: Apply patch
        shell: bash
        run: |
          python3 tools/apply_dashboard_todo_card_patch.py
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/tridev/familyhub/feature/dashboard/DashboardFragment.java'); t=p.read_text(encoding='utf-8'); old='            long todayStart = startOfToday();\\n'; new='            Calendar startOfDay = Calendar.getInstance();\\n            startOfDay.set(Calendar.HOUR_OF_DAY, 0);\\n            startOfDay.set(Calendar.MINUTE, 0);\\n            startOfDay.set(Calendar.SECOND, 0);\\n            startOfDay.set(Calendar.MILLISECOND, 0);\\n            long todayStart = startOfDay.getTimeInMillis();\\n'; assert old in t; p.write_text(t.replace(old,new,1),encoding='utf-8')"

      - name: Verify scope
        shell: bash
        run: |
          git diff --check
          git status --short
          test "$(git diff --name-only | grep -Ev '^(app/src/main/java/com/tridev/familyhub/core/ui/cards/ActionCardView.java|app/src/main/java/com/tridev/familyhub/feature/dashboard/DashboardFragment.java|app/src/main/res/layout/fragment_dashboard.xml)$' | wc -l)" -eq 0
          test -f app/src/main/res/values/strings_dashboard_todo.xml

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Commit app changes
        shell: bash
        run: |
          git config user.name "tridevmaurya3"
          git config user.email "tridevmaurya3@gmail.com"
          git add app/src/main/java/com/tridev/familyhub/core/ui/cards/ActionCardView.java app/src/main/java/com/tridev/familyhub/feature/dashboard/DashboardFragment.java app/src/main/res/layout/fragment_dashboard.xml app/src/main/res/values/strings_dashboard_todo.xml
          git commit -m "Add realtime To-Do dashboard card and center action details"
          git push origin HEAD:main
