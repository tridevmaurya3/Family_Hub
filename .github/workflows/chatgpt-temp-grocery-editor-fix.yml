name: Temporary grocery editor stability fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-temp-grocery-editor-fix.yml'

permissions:
  contents: write

jobs:
  patch-grocery-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stabilize inline purchase editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    private String overlayShoppingSelection = SHOPPING_ALL;\n    private final Set<String> collapsedCategories = new HashSet<>();',
                  '    private String overlayShoppingSelection = SHOPPING_ALL;\n    private boolean overlayInlinePurchaseEditorOpen;\n    private final Set<String> collapsedCategories = new HashSet<>();'
              ),
              (
                  '    private void refreshPanel() {\n        if (repository == null || itemContainer == null) return;\n        repository.loadItems("", this::renderItems);\n    }',
                  '    private void refreshPanel() {\n        if (repository == null || itemContainer == null || overlayInlinePurchaseEditorOpen) return;\n        repository.loadItems("", this::renderItems);\n    }'
              ),
              (
                  '    private void renderItems(List<GroceryItem> items) {\n        if (itemContainer == null) return;',
                  '    private void renderItems(List<GroceryItem> items) {\n        if (itemContainer == null || overlayInlinePurchaseEditorOpen) return;'
              ),
              (
                  '    private void showInlinePurchaseEditor(GroceryItem item) {\n        if (itemContainer == null) return;\n        itemContainer.removeAllViews();',
                  '    private void showInlinePurchaseEditor(GroceryItem item) {\n        if (itemContainer == null) return;\n        overlayInlinePurchaseEditorOpen = true;\n        itemContainer.removeAllViews();'
              ),
              (
                  '        cancel.setOnClickListener(v -> refreshPanel());',
                  '        cancel.setOnClickListener(v -> {\n            overlayInlinePurchaseEditorOpen = false;\n            refreshPanel();\n        });'
              ),
              (
                  '        skip.setOnClickListener(v -> {\n            rememberPurchaseMoneySelections(item, moneyAccount, moneyCategory);\n            repository.setPurchased(item, true, () -> showFloatingUndo(item));\n        });',
                  '        skip.setOnClickListener(v -> {\n            rememberPurchaseMoneySelections(item, moneyAccount, moneyCategory);\n            overlayInlinePurchaseEditorOpen = false;\n            repository.setPurchased(item, true, () -> showFloatingUndo(item));\n        });'
              ),
              (
                  '            rememberPurchaseMoneySelections(item, moneyAccount, moneyCategory);\n            repository.setPurchased(item, true, () -> showFloatingUndo(item));\n        });\n    }',
                  '            rememberPurchaseMoneySelections(item, moneyAccount, moneyCategory);\n            overlayInlinePurchaseEditorOpen = false;\n            repository.setPurchased(item, true, () -> showFloatingUndo(item));\n        });\n    }'
              ),
              (
                  '    private void showFloatingUndo(GroceryItem item) {\n        if (itemContainer == null) return;\n        itemContainer.removeAllViews();',
                  '    private void showFloatingUndo(GroceryItem item) {\n        if (itemContainer == null) return;\n        overlayInlinePurchaseEditorOpen = false;\n        itemContainer.removeAllViews();'
              ),
              (
                  '            overlayShoppingSelection = SHOPPING_ALL;\n            cornerResizeActive = false;',
                  '            overlayShoppingSelection = SHOPPING_ALL;\n            overlayInlinePurchaseEditorOpen = false;\n            cornerResizeActive = false;'
              ),
              (
                  '            shoppingSubtitle.setText(overlayShoppingMode\n                    ? "(Shopping mode • " + shoppingSelectionLabel(overlayShoppingSelection) + ")"\n                    : "(" + getString(R.string.grocery_list_type) + ")");',
                  '            shoppingSubtitle.setText(overlayShoppingMode\n                    ? "Mode On • " + shoppingSelectionLabel(overlayShoppingSelection)\n                    : "Shopping list");'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected block not found:\n' + old[:180])
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          git rm .github/workflows/chatgpt-temp-grocery-editor-fix.yml
          if ! git diff --cached --quiet; then
            git commit -m "Stabilize floating grocery purchase editor"
            git push
          fi
