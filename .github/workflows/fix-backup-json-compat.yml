name: Fix backup JSONObject compatibility

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/fix-backup-json-compat.yml'

permissions:
  contents: write

jobs:
  fix-backup-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Replace unsupported JSONObject keySet calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/tridev/familyhub/backup/BackupArchiveManager.java')
          text = path.read_text(encoding='utf-8')

          import_marker = 'import java.util.HashSet;\n'
          if 'import java.util.Iterator;\n' not in text:
              if import_marker not in text:
                  raise SystemExit('HashSet import marker not found')
              text = text.replace(
                  import_marker,
                  import_marker + 'import java.util.Iterator;\n',
                  1,
              )

          first_old = "        for (String key : source.keySet()) {\n            Object value = source.get(key);"
          first_new = "        Iterator<String> sourceKeys = source.keys();\n        while (sourceKeys.hasNext()) {\n            String key = sourceKeys.next();\n            Object value = source.get(key);"
          if first_old not in text:
              raise SystemExit('Safety preferences keySet block not found')
          text = text.replace(first_old, first_new, 1)

          second_old = "                for (String key : countObject.keySet()) {\n                    if (TABLES.contains(key)) {"
          second_new = "                Iterator<String> countKeys = countObject.keys();\n                while (countKeys.hasNext()) {\n                    String key = countKeys.next();\n                    if (TABLES.contains(key)) {"
          if second_old not in text:
              raise SystemExit('Manifest tableCounts keySet block not found')
          text = text.replace(second_old, second_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name "Family Hub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/backup/BackupArchiveManager.java
          git commit -m "Fix Android JSONObject iterator compatibility"
          git push origin master
