name: Android Build

on:
  push:
    branches:
      - master
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[CI] Family Hub Android Build')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure safe CI-only Android properties
        shell: bash
        run: |
          printf 'sdk.dir=%s\nMAPS_API_KEY=CI_DUMMY_KEY\n' "$ANDROID_HOME" > local.properties
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "family-hub-ci",
              "storage_bucket": "family-hub-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.tridev.familyhub"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI_DUMMY_FIREBASE_API_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and assemble debug APK
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon 2>&1 | tee android-build.log
          build_exit=${PIPESTATUS[0]}
          echo "exit_code=${build_exit}" >> "$GITHUB_OUTPUT"
          tail -n 180 android-build.log > android-build-tail.log
          exit 0

      - name: Publish build result to verification issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          BUILD_EXIT_CODE: ${{ steps.android_build.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const exitCode = process.env.BUILD_EXIT_CODE || '1';
            let tail = 'Build log was not created.';
            if (fs.existsSync('android-build-tail.log')) {
              tail = fs.readFileSync('android-build-tail.log', 'utf8');
            }
            if (tail.length > 45000) {
              tail = tail.slice(-45000);
            }
            const passed = exitCode === '0';
            const body = [
              passed
                ? '✅ **Android build verification passed**'
                : '❌ **Android build verification failed**',
              '',
              '`testDebugUnitTest` and `assembleDebug` were run on `master` with Java 17.',
              '',
              '<details><summary>Final Gradle output</summary>',
              '',
              '```text',
              tail,
              '```',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail workflow when Gradle failed
        if: steps.android_build.outputs.exit_code != '0'
        run: exit 1
