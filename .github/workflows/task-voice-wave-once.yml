                if (voiceWave != null) voiceWave.showProcessing();
            } else if (TaskVoiceCaptureActivity.STATE_PARTIAL.equals(state)) {
                String spoken = intent.getStringExtra(TaskVoiceCaptureActivity.EXTRA_TEXT);
