name: Apply To-Do Voice Wave Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task-voice-wave-once.yml'

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure Android CI properties
        shell: bash
        run: |
          printf 'sdk.dir=%s\nMAPS_API_KEY=CI_DUMMY_KEY\n' "$ANDROID_HOME" > local.properties
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "family-hub-ci",
              "storage_bucket": "family-hub-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                "android_client_info": {"package_name": "com.tridev.familyhub"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "CI_DUMMY_FIREBASE_API_KEY"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Apply scoped voice-wave patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          frag_java = root / 'app/src/main/java/com/tridev/familyhub/feature/tasks/FamilyTasksFragment.java'
          overlay_java = root / 'app/src/main/java/com/tridev/familyhub/feature/tasks/overlay/FamilyTaskOverlayService.java'
          frag_xml = root / 'app/src/main/res/layout/fragment_family_tasks.xml'
          dialog_xml = root / 'app/src/main/res/layout/dialog_family_task.xml'
          manifest = root / 'app/src/main/AndroidManifest.xml'
          voice_dir = root / 'app/src/main/java/com/tridev/familyhub/feature/tasks/voice'
          voice_dir.mkdir(parents=True, exist_ok=True)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Anchor not found: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'Anchor count != 1 for {label}: {text.count(old)}')
              return text.replace(old, new, 1)

          wave_java = r'''package com.tridev.familyhub.feature.tasks.voice;

import android.content.Context;
import android.graphics.Canvas;
import android.graphics.Color;
import android.graphics.Paint;
import android.os.SystemClock;
import android.util.AttributeSet;
import android.view.View;

import androidx.annotation.Nullable;

/** Compact red listening waveform. GONE while idle so it occupies no layout space. */
public final class TaskVoiceWaveView extends View {
    private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
    private boolean listening;
    private boolean processing;
    private float level;
    private long startedAt;
    private final Runnable frame = new Runnable() {
        @Override public void run() {
            if (!listening) return;
            invalidate();
            postDelayed(this, 70L);
        }
    };

    public TaskVoiceWaveView(Context context) { this(context, null); }
    public TaskVoiceWaveView(Context context, @Nullable AttributeSet attrs) {
        super(context, attrs);
        paint.setColor(Color.rgb(220, 45, 82));
        paint.setStrokeCap(Paint.Cap.ROUND);
        setVisibility(GONE);
        setContentDescription("Voice listening waveform");
    }

    public void startListening() {
        processing = false;
        level = Math.max(level, 0.18f);
        if (!listening) {
            listening = true;
            startedAt = SystemClock.uptimeMillis();
            setVisibility(VISIBLE);
            removeCallbacks(frame);
            post(frame);
        }
    }

    public void setLevel(float rmsDb) {
        if (!listening) startListening();
        level = Math.max(0.12f, Math.min(1f, (rmsDb + 2f) / 12f));
    }

    public void showProcessing() {
        if (!listening) startListening();
        processing = true;
        level = 0.35f;
    }

    public void stopListening() {
        listening = false;
        processing = false;
        level = 0f;
        removeCallbacks(frame);
        setVisibility(GONE);
        invalidate();
    }

    @Override protected void onDetachedFromWindow() {
        removeCallbacks(frame);
        super.onDetachedFromWindow();
    }

    @Override protected void onDraw(Canvas canvas) {
        super.onDraw(canvas);
        if (!listening) return;
        float width = getWidth();
        float height = getHeight();
        float centerY = height / 2f;
        int bars = 21;
        float gap = width / (bars + 1f);
        float phase = (SystemClock.uptimeMillis() - startedAt) / 155f;
        paint.setStrokeWidth(Math.max(2f, gap * 0.34f));
        for (int i = 0; i < bars; i++) {
            float wave = (float) Math.abs(Math.sin(phase + i * 0.61f));
            float secondary = (float) Math.abs(Math.cos(phase * 0.72f + i * 0.37f));
            float energy = processing ? (0.22f + 0.25f * wave)
                    : (0.18f + (0.48f * wave + 0.24f * secondary) * level);
            float half = Math.max(2f, height * Math.min(0.46f, energy) / 2f);
            float x = gap * (i + 1);
            canvas.drawLine(x, centerY - half, x, centerY + half, paint);
        }
    }
}
