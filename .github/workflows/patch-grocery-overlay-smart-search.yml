name: Patch Grocery Overlay Smart Search

on:
  push:
    paths:
      - '.github/workflows/patch-grocery-overlay-smart-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand floating Grocery search fields
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java')
          text = path.read_text(encoding='utf-8')

          old = '''    private boolean matchesOverlaySearch(GroceryItem item) {\n        if (overlaySearchQuery.isEmpty()) return true;\n        String query = overlaySearchQuery.toLowerCase(java.util.Locale.ENGLISH);\n        return item.name.toLowerCase(java.util.Locale.ENGLISH).contains(query)\n                || item.category.toLowerCase(java.util.Locale.ENGLISH).contains(query)\n                || item.quantity.toLowerCase(java.util.Locale.ENGLISH).contains(query)\n                || item.assignedMemberName.toLowerCase(java.util.Locale.ENGLISH).contains(query);\n    }\n'''

          new = '''    private boolean matchesOverlaySearch(GroceryItem item) {\n        if (overlaySearchQuery.isEmpty()) return true;\n        String query = overlaySearchQuery.toLowerCase(java.util.Locale.ENGLISH);\n        String cycleLabel = shoppingSelectionLabel(item.listType);\n        String purchaseState = item.isPurchased ? "purchased" : "pending";\n        String searchable = String.join("\\n",\n                item.name,\n                item.category,\n                item.quantity,\n                item.storeName,\n                item.notes,\n                item.assignedMemberName,\n                item.purchasedByName,\n                item.updatedByName,\n                item.priority,\n                item.buyingStatus,\n                item.listType,\n                cycleLabel,\n                purchaseState,\n                String.valueOf(item.purchaseCount),\n                String.valueOf(item.estimatedCost),\n                String.valueOf(item.actualCost)\n        ).toLowerCase(java.util.Locale.ENGLISH);\n        if (searchable.contains(query)) return true;\n\n        // Let a user type either 1200, 1,200 or ₹1,200 for visible Grocery amounts.\n        String amountQuery = query.replace("₹", "").replace(",", "").trim();\n        if (amountQuery.isEmpty()) return false;\n        return String.valueOf(item.estimatedCost).contains(amountQuery)\n                || String.valueOf(item.actualCost).contains(amountQuery);\n    }\n'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'smart search anchor: expected 1, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          git commit -m "Expand floating Grocery smart search"
          git push
