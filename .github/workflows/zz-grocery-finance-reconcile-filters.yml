          path.write_text(text, encoding='utf-8')

      - name: Verify guarded patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app/src/main/java/com/tridev/familyhub/data/repository/FinanceRepository.java app/src/main/java/com/tridev/familyhub/data/repository/GroceryRepository.java app/src/main/java/com/tridev/familyhub/feature/finance/FinanceFragment.java app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java "
          grep -q 'reconcileFinanceLinksNow' app/src/main/java/com/tridev/familyhub/data/repository/FinanceRepository.java
          grep -q 'setupAdvancedFinanceFilters' app/src/main/java/com/tridev/familyhub/feature/finance/FinanceFragment.java
          grep -q 'ensureGroceryGroupingChip' app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java

      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/tridev/familyhub/data/repository/FinanceRepository.java \
                  app/src/main/java/com/tridev/familyhub/data/repository/GroceryRepository.java \
                  app/src/main/java/com/tridev/familyhub/feature/finance/FinanceFragment.java \
                  app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java
          git commit -m 'Repair Grocery finance links and add advanced filters'
          git push origin HEAD:main
