name: Grocery Finance Reconcile Filters

on:
  push:
    paths:
      - '.github/workflows/zz-grocery-finance-reconcile-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded patch
        run: python .github/scripts/patch_grocery_finance_filters.py

      - name: Verify patch scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/src/main/java/com/tridev/familyhub/data/repository/FinanceRepository.java \
            app/src/main/java/com/tridev/familyhub/data/repository/GroceryRepository.java \
            app/src/main/java/com/tridev/familyhub/feature/finance/FinanceFragment.java \
            app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java | sort)"
          test "$changed" = "$expected"
          grep -q 'reconcileFinanceLinksNow' app/src/main/java/com/tridev/familyhub/data/repository/FinanceRepository.java
          grep -q 'setupAdvancedFinanceFilters' app/src/main/java/com/tridev/familyhub/feature/finance/FinanceFragment.java
          grep -q 'ensureGroceryGroupingChip' app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java

      - name: Commit patch to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/tridev/familyhub/data/repository/FinanceRepository.java
          git add app/src/main/java/com/tridev/familyhub/data/repository/GroceryRepository.java
          git add app/src/main/java/com/tridev/familyhub/feature/finance/FinanceFragment.java
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java
          git commit -m 'Repair Grocery finance links and add advanced filters'
          git push origin HEAD:main
