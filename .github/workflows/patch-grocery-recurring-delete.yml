name: Patch Grocery Recurring Delete

on:
  push:
    paths:
      - '.github/workflows/patch-grocery-recurring-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix dialog line breaks
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java')
          text = path.read_text(encoding='utf-8')
          old_one = '                            + "\\\\nThis removes the master and stops future cycles. "'
          new_one = '                            + "\\nThis removes the master and stops future cycles. "'
          old_two = '                        + "\\\\nChoose what you want to remove.")'
          new_two = '                        + "\\nChoose what you want to remove.")'
          if text.count(old_one) != 1 or text.count(old_two) != 1:
              raise SystemExit('Expected recurring delete dialog line-break anchors')
          text = text.replace(old_one, new_one, 1).replace(old_two, new_two, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java
          git commit -m "Polish recurring Grocery delete dialog text"
          git push
