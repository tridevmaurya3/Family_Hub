name: Patch Grocery Recurring Delete

on:
  push:
    paths:
      - '.github/workflows/patch-grocery-recurring-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe recurring delete patch
        shell: python
        run: |
          from pathlib import Path

          repo_path = Path('app/src/main/java/com/tridev/familyhub/data/repository/GroceryRepository.java')
          repo = repo_path.read_text(encoding='utf-8')
          repo_anchor = '    public void clearPurchased(@NonNull ActionCallback callback) {\n'
          if repo.count(repo_anchor) != 1:
              raise SystemExit('Expected one clearPurchased anchor')
          repo_method = '''    /**
     * Stops the recurring schedule without deleting any completed purchase history.
     * The existing tombstone prevents history recovery from recreating the master.
     */
    public void deleteRecurringMasterAndFuture(
            @NonNull GroceryItem source,
            @NonNull ActionCallback callback
    ) {
        final String wantedName = source.name.trim();
        USER_ACTION_EXECUTOR.execute(() -> {
            GroceryItem master = null;
            for (GroceryItem candidate : groceryItemDao.getAll()) {
                if (candidate == null || candidate.isPurchased
                        || !candidate.name.equalsIgnoreCase(wantedName)) {
                    continue;
                }
                String origin = GroceryRecurrenceEngine.originalCycle(candidate);
                if (GroceryRecurrenceEngine.isRecurringType(origin)) {
                    master = candidate;
                    break;
                }
            }
            if (master == null) {
                mainHandler.post(callback::onComplete);
                return;
            }

            recoveredHistoryPreferences().edit()
                    .putBoolean(deletedMasterKey(master.name), true).apply();
            if (!master.cloudId.isEmpty()) {
                markDeletedCloudId(master.cloudId);
            }
            removeLinkedFinance(master);
            groceryItemDao.delete(master);
            GroceryWidgetProvider.refreshAll(appContext);

            GroceryItem removedMaster = master;
            mainHandler.post(() -> {
                callback.onComplete();
                if (!removedMaster.cloudId.isEmpty()) {
                    removeRemoteItem(removedMaster);
                }
            });
        });
    }

'''
          repo = repo.replace(repo_anchor, repo_method + repo_anchor, 1)
          repo_path.write_text(repo, encoding='utf-8')

          fragment_path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java')
          fragment = fragment_path.read_text(encoding='utf-8')
          start_marker = '    private void confirmDelete(@NonNull GroceryItem item) {\n'
          end_marker = '    private void confirmClearPurchased() {\n'
          start = fragment.find(start_marker)
          end = fragment.find(end_marker, start)
          if start < 0 or end < 0 or fragment.find(start_marker, start + 1) >= 0:
              raise SystemExit('Recurring delete fragment anchors are not unique')

          replacement = '''    private void confirmDelete(@NonNull GroceryItem item) {
        String cycle = GroceryRecurrenceEngine.originalCycle(item);
        boolean recurring = GroceryRecurrenceEngine.isRecurringType(cycle);
        if (recurring && (item.isPurchased || item.historyOnly)) {
            showRecurringDeleteScope(item, cycle);
            return;
        }
        if (recurring) {
            new MaterialAlertDialogBuilder(requireContext())
                    .setTitle("Remove recurring item?")
                    .setMessage(item.name + " • " + cycleLabel(cycle)
                            + "\\nThis removes the master and stops future cycles. "
                            + "Completed purchase history stays unchanged.")
                    .setNegativeButton(R.string.cancel, null)
                    .setPositiveButton(R.string.remove, (dialog, which) ->
                            stageRecurringMasterDeleteWithUndo(item, cycle))
                    .show();
            return;
        }
        showStandardDeleteConfirmation(item);
    }

    private void showRecurringDeleteScope(
            @NonNull GroceryItem item,
            @NonNull String cycle
    ) {
        String[] choices = {
                "Only this purchase",
                "Master + future cycle"
        };
        new MaterialAlertDialogBuilder(requireContext())
                .setTitle("Remove recurring item?")
                .setMessage(item.name + " • " + cycleLabel(cycle)
                        + "\\nChoose what you want to remove.")
                .setItems(choices, (dialog, which) -> {
                    if (which == 0) {
                        stageItemDeleteWithUndo(item,
                                item.name + " purchase removed");
                    } else {
                        stageRecurringMasterDeleteWithUndo(item, cycle);
                    }
                })
                .setNegativeButton(R.string.cancel, null)
                .show();
    }

    private void showStandardDeleteConfirmation(@NonNull GroceryItem item) {
        new MaterialAlertDialogBuilder(requireContext())
                .setTitle(R.string.grocery_delete_title)
                .setMessage(getString(
                        R.string.grocery_delete_message,
                        item.name
                ))
                .setNegativeButton(R.string.cancel, null)
                .setPositiveButton(R.string.remove, (dialog, which) ->
                        stageItemDeleteWithUndo(item, item.name + " removed"))
                .show();
    }

    private void stageItemDeleteWithUndo(
            @NonNull GroceryItem item,
            @NonNull String message
    ) {
        adapter.temporarilyHide(item);
        final boolean[] restored = {false};
        Snackbar undo = Snackbar.make(
                requireView(),
                message,
                Snackbar.LENGTH_LONG
        );
        undo.setAction("UNDO", view -> {
            restored[0] = true;
            adapter.restoreTemporarilyHidden(item);
        });
        undo.addCallback(new Snackbar.Callback() {
            @Override
            public void onDismissed(
                    Snackbar transientBottomBar, int event) {
                if (restored[0]
                        || event == Snackbar.Callback.DISMISS_EVENT_ACTION) {
                    return;
                }
                adapter.finishTemporaryHide(item);
                repository.delete(item, () -> {
                    if (binding != null) {
                        loadItems(currentQuery());
                    }
                });
            }
        });
        undo.show();
    }

    private void stageRecurringMasterDeleteWithUndo(
            @NonNull GroceryItem item,
            @NonNull String cycle
    ) {
        final boolean[] cancelled = {false};
        Snackbar undo = Snackbar.make(
                requireView(),
                "Future " + cycleLabel(cycle) + " cycle will be removed for "
                        + item.name,
                Snackbar.LENGTH_LONG
        );
        undo.setAction("UNDO", view -> cancelled[0] = true);
        undo.addCallback(new Snackbar.Callback() {
            @Override
            public void onDismissed(
                    Snackbar transientBottomBar, int event) {
                if (cancelled[0]
                        || event == Snackbar.Callback.DISMISS_EVENT_ACTION) {
                    return;
                }
                repository.deleteRecurringMasterAndFuture(item, () -> {
                    if (binding != null) {
                        loadItems(currentQuery());
                    }
                });
            }
        });
        undo.show();
    }

'''
          fragment = fragment[:start] + replacement + fragment[end:]
          fragment_path.write_text(fragment, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/data/repository/GroceryRepository.java
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java
          git commit -m "Add scoped recurring Grocery delete options"
          git push
