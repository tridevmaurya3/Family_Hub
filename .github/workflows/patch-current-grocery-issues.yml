name: Patch Current Grocery Issues

on:
  push:
    paths:
      - '.github/workflows/patch-current-grocery-issues.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted issue fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          # 1) Floating smart category picker: give the overlay Service a Material3 theme.
          picker_path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/GrocerySmartCategoryPicker.java')
          picker = picker_path.read_text(encoding='utf-8')
          picker = replace_once(
              picker,
              '''            if (GroceryOptionCatalog.ADD_CATEGORY_LABEL.equals(current)) current = "";\n            show(context, current, handler::onSelected);\n''',
              '''            if (GroceryOptionCatalog.ADD_CATEGORY_LABEL.equals(current)) current = "";\n            Context themedContext = new android.view.ContextThemeWrapper(\n                    context, com.tridev.familyhub.R.style.Theme_FamilyHub);\n            show(themedContext, current, handler::onSelected);\n''',
              'overlay themed picker context'
          )
          picker = replace_once(
              picker,
              '''    private static void configureOverlayWindow(@NonNull Context context,\n                                               @NonNull AlertDialog dialog) {\n        if (!(context instanceof android.app.Service) || dialog.getWindow() == null) return;\n        dialog.getWindow().setType(\n                android.view.WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY);\n    }\n''',
              '''    private static void configureOverlayWindow(@NonNull Context context,\n                                               @NonNull AlertDialog dialog) {\n        if (!isServiceContext(context) || dialog.getWindow() == null) return;\n        dialog.getWindow().setType(\n                android.view.WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY);\n    }\n\n    private static boolean isServiceContext(@NonNull Context context) {\n        Context current = context;\n        while (true) {\n            if (current instanceof android.app.Service) return true;\n            if (!(current instanceof android.content.ContextWrapper)) return false;\n            Context base = ((android.content.ContextWrapper) current).getBaseContext();\n            if (base == null || base == current) return false;\n            current = base;\n        }\n    }\n''',
              'overlay service context detection'
          )
          picker_path.write_text(picker, encoding='utf-8')

          # 2) Grocery summary: ProfessionalUiBinder owns Due today/Purchased this month.
          fragment_path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java')
          fragment = fragment_path.read_text(encoding='utf-8')
          fragment = replace_once(
              fragment,
              '''    private void renderSummary(@NonNull List<GroceryItem> items) {\n        int pending = 0;\n        int purchased = 0;\n        double total = 0;\n        double actualTotal = 0;\n        for (GroceryItem item : items) {\n            actualTotal += Math.max(0D, item.actualCost);\n            if (item.isPurchased) {\n                purchased++;\n            } else {\n                pending++;\n                total += item.estimatedCost;\n            }\n        }\n        binding.groceryPendingValue.setText(String.valueOf(pending));\n        binding.groceryTotalValue.setText(currencyFormat.format(total));\n        binding.groceryActualValue.setText(currencyFormat.format(actualTotal));\n        double budget = repository.getMonthlyBudget();\n        binding.groceryBudgetValue.setText(budget <= 0D\n                ? getString(R.string.grocery_set_budget)\n                : currencyFormat.format(Math.max(0D, budget - total)));\n        binding.clearPurchasedButton.setEnabled(purchased > 0);\n    }\n''',
              '''    private void renderSummary(@NonNull List<GroceryItem> items) {\n        int pending = 0;\n        int purchased = 0;\n        double total = 0;\n        for (GroceryItem item : items) {\n            if (item.isPurchased) {\n                purchased++;\n            } else {\n                pending++;\n                total += item.estimatedCost;\n            }\n        }\n        binding.groceryPendingValue.setText(String.valueOf(pending));\n        binding.groceryTotalValue.setText(currencyFormat.format(total));\n        // GroceryProfessionalUiBinder exclusively owns these two repurposed cards:\n        // Due today and Purchased this month. Do not briefly overwrite them with\n        // the legacy Budget/Actual values during repository refreshes.\n        binding.clearPurchasedButton.setEnabled(purchased > 0);\n    }\n''',
              'stable professional summary'
          )
          fragment_path.write_text(fragment, encoding='utf-8')

          # 3) Firebase SOS model: accept cancellation metadata already written by repository.
          sos_path = Path('app/src/main/java/com/tridev/familyhub/feature/sos/FamilySosAlert.java')
          sos = sos_path.read_text(encoding='utf-8')
          sos = replace_once(
              sos,
              '''    public long updatedAt;\n    @NonNull public Map<String, FamilySosResponse> responses =\n''',
              '''    public long updatedAt;\n    public long cancelledAt;\n    @NonNull public String cancelledBy = "";\n    @NonNull public Map<String, FamilySosResponse> responses =\n''',
              'SOS cancellation metadata'
          )
          sos_path.write_text(sos, encoding='utf-8')

          # 4) Location privacy rule: owner can always read own node; expiry still gates viewers.
          rules_path = Path('database.rules.json')
          rules = rules_path.read_text(encoding='utf-8')
          old_rule = '''          ".read": "auth != null && root.child('memberships').child($familyId).child(auth.uid).child('status').val() === 'ACTIVE' && root.child('memberships').child($familyId).child($uid).child('status').val() === 'ACTIVE' && (!data.child('sharingExpiresAt').exists() || data.child('sharingExpiresAt').val() === 0 || data.child('sharingExpiresAt').val() > now) && (auth.uid === $uid || root.child('memberships').child($familyId).child(auth.uid).child('role').val().matches(/^(OWNER_ADMIN|GUARDIAN)$/) || root.child('journeyPrivacy').child($familyId).child($uid).child('viewers').child(auth.uid).val() === true)",\n'''
          new_rule = '''          ".read": "auth != null && root.child('memberships').child($familyId).child(auth.uid).child('status').val() === 'ACTIVE' && root.child('memberships').child($familyId).child($uid).child('status').val() === 'ACTIVE' && (auth.uid === $uid || ((!data.child('sharingExpiresAt').exists() || data.child('sharingExpiresAt').val() === 0 || data.child('sharingExpiresAt').val() > now) && (root.child('memberships').child($familyId).child(auth.uid).child('role').val().matches(/^(OWNER_ADMIN|GUARDIAN)$/) || root.child('journeyPrivacy').child($familyId).child($uid).child('viewers').child(auth.uid).val() === true)))",\n'''
          rules = replace_once(rules, old_rule, new_rule, 'own location read rule')
          rules_path.write_text(rules, encoding='utf-8')

      - name: Validate rules JSON
        run: python -m json.tool database.rules.json > /dev/null

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/GrocerySmartCategoryPicker.java
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/GroceryFragment.java
          git add app/src/main/java/com/tridev/familyhub/feature/sos/FamilySosAlert.java
          git add database.rules.json
          git commit -m "Fix Grocery overlay crash and summary flicker"
          git push
