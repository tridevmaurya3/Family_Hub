name: Patch Floating Grocery Compact UI

on:
  push:
    paths:
      - '.github/workflows/patch-floating-grocery-compact-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact UI changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          picker_path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/GrocerySmartCategoryPicker.java')
          picker = picker_path.read_text(encoding='utf-8')
          picker = replace_once(picker,
              '''        int gap = dp(context, 8);\n        int side = dp(context, 14);\n''',
              '''        int gap = dp(context, 5);\n        int side = dp(context, 10);\n''',
              'picker spacing')
          picker = replace_once(picker,
              '''        root.addView(search, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 46)));\n''',
              '''        root.addView(search, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 38)));\n''',
              'search height')
          picker = replace_once(picker,
              '''        root.addView(recentScroll, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 46)));\n''',
              '''        root.addView(recentScroll, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 34)));\n''',
              'recent height')
          picker = replace_once(picker,
              '''        root.addView(popularScroll, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 46)));\n''',
              '''        root.addView(popularScroll, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 34)));\n''',
              'popular height')
          picker = replace_once(picker,
              '''        listHeader.addView(allTitle, new LinearLayout.LayoutParams(\n                0, dp(context, 34), 1f));\n        MaterialButton add = smallAction(context, "+ Add category");\n        listHeader.addView(add, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.WRAP_CONTENT, dp(context, 38)));\n        root.addView(listHeader, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 42)));\n''',
              '''        listHeader.addView(allTitle, new LinearLayout.LayoutParams(\n                0, dp(context, 28), 1f));\n        MaterialButton add = smallAction(context, "+ Add category");\n        listHeader.addView(add, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.WRAP_CONTENT, dp(context, 32)));\n        root.addView(listHeader, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 34)));\n''',
              'list header')
          picker = replace_once(picker,
              '''        root.addView(scroll, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 270)));\n''',
              '''        int maxListHeight = Math.min(dp(context, 196),\n                Math.max(dp(context, 142), context.getResources()\n                        .getDisplayMetrics().heightPixels / 4));\n        root.addView(scroll, new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, maxListHeight));\n''',
              'list height')
          picker = replace_once(picker,
              '''            row.setTextSize(12.5f);\n''',
              '''            row.setTextSize(11.5f);\n''',
              'row text size')
          picker = replace_once(picker,
              '''            row.setMinHeight(dp(context, 44));\n            row.setMinimumHeight(dp(context, 44));\n            row.setCornerRadius(dp(context, 12));\n''',
              '''            row.setMinHeight(dp(context, 36));\n            row.setMinimumHeight(dp(context, 36));\n            row.setCornerRadius(dp(context, 11));\n''',
              'row dimensions')
          picker = replace_once(picker,
              '''            LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(\n                    ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 44));\n            params.bottomMargin = dp(context, 5);\n''',
              '''            LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(\n                    ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 36));\n            params.bottomMargin = dp(context, 4);\n''',
              'row layout')
          picker = replace_once(picker,
              '''            LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(\n                    ViewGroup.LayoutParams.WRAP_CONTENT, dp(context, 38));\n            params.setMarginEnd(dp(context, 6));\n''',
              '''            LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(\n                    ViewGroup.LayoutParams.WRAP_CONTENT, dp(context, 30));\n            params.setMarginEnd(dp(context, 5));\n''',
              'chip layout')
          picker = replace_once(picker,
              '''        button.setTextSize(11.5f);\n''',
              '''        button.setTextSize(10.5f);\n''',
              'chip text')
          picker = replace_once(picker,
              '''        button.setPadding(dp(context, 10), 0, dp(context, 10), 0);\n        button.setCornerRadius(dp(context, 14));\n''',
              '''        button.setPadding(dp(context, 8), 0, dp(context, 8), 0);\n        button.setCornerRadius(dp(context, 12));\n''',
              'chip shape')
          picker = replace_once(picker,
              '''        title.setTextSize(11.5f);\n''',
              '''        title.setTextSize(10.5f);\n''',
              'section title text')
          picker = replace_once(picker,
              '''        LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 30));\n        params.topMargin = dp(context, 4);\n''',
              '''        LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, dp(context, 22));\n        params.topMargin = dp(context, 2);\n''',
              'section title height')
          picker_path.write_text(picker, encoding='utf-8')

          overlay_path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java')
          overlay = overlay_path.read_text(encoding='utf-8')
          overlay = replace_once(overlay,
              '''        subtitleRow.addView(overlayLiveStatus, new LinearLayout.LayoutParams(0, dp(20), 0.55f));\n        subtitleRow.addView(shoppingSubtitle, new LinearLayout.LayoutParams(0, dp(20), 0.45f));\n''',
              '''        LinearLayout.LayoutParams liveStatusParams =\n                new LinearLayout.LayoutParams(dp(48), dp(20));\n        subtitleRow.addView(overlayLiveStatus, liveStatusParams);\n        subtitleRow.addView(shoppingSubtitle,\n                new LinearLayout.LayoutParams(0, dp(20), 1f));\n''',
              'subtitle allocation')
          overlay = replace_once(overlay,
              '''        LinearLayout.LayoutParams screenOnParams = new LinearLayout.LayoutParams(dp(60), dp(20));\n''',
              '''        LinearLayout.LayoutParams screenOnParams = new LinearLayout.LayoutParams(dp(42), dp(20));\n''',
              'screen button width')
          overlay = replace_once(overlay,
              '''        listTypeGroup.addView(daily, new RadioGroup.LayoutParams(0, dp(36), 0.75f));\n        listTypeGroup.addView(twoMonth, new RadioGroup.LayoutParams(0, dp(36), 0.92f));\n        listTypeGroup.addView(threeMonth, new RadioGroup.LayoutParams(0, dp(36), 1.35f));\n        listTypeGroup.addView(monthly, new RadioGroup.LayoutParams(0, dp(36), 0.98f));\n''',
              '''        listTypeGroup.addView(daily, new RadioGroup.LayoutParams(0, dp(36), 1f));\n        listTypeGroup.addView(twoMonth, new RadioGroup.LayoutParams(0, dp(36), 1f));\n        listTypeGroup.addView(threeMonth, new RadioGroup.LayoutParams(0, dp(36), 1f));\n        listTypeGroup.addView(monthly, new RadioGroup.LayoutParams(0, dp(36), 1f));\n''',
              'equal recurrence weights')
          overlay = replace_once(overlay,
              '''            screenOn.setText(overlayShoppingScreenOn ? "Screen On ✓" : "Screen On");\n''',
              '''            screenOn.setText(overlayShoppingScreenOn ? "On ✓" : "On");\n''',
              'compact screen button text')
          overlay = replace_once(overlay,
              '''                shoppingSubtitle.setText("Shopping • "\n                        + shoppingSelectionLabel(overlayShoppingSelection));\n''',
              '''                shoppingSubtitle.setText("Shop • "\n                        + shoppingSelectionLabel(overlayShoppingSelection));\n''',
              'compact shopping subtitle')
          overlay_path.write_text(overlay, encoding='utf-8')

      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/GrocerySmartCategoryPicker.java
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          git commit -m "Compact floating Grocery picker and recurrence row"
          git push