name: Fix Documents Vault Intent Compatibility

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: startsWith(github.event.issue.title, '[PATCH] Fix Documents Vault Intent')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply Android Intent compatibility fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/tridev/familyhub/feature/documents/DocumentsFragment.java')
          text = path.read_text(encoding='utf-8')

          old_open = '''            Intent intent = new Intent(Intent.ACTION_VIEW)
                    .setDataAndType(
                            uri,
                            document.mimeType.isEmpty()
                                    ? "*/*"
                                    : document.mimeType
                    )
                    .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                    .setClipData(ClipData.newUri(
                            requireContext().getContentResolver(),
                            document.title,
                            uri
                    ));'''
          new_open = '''            Intent intent = new Intent(Intent.ACTION_VIEW)
                    .setDataAndType(
                            uri,
                            document.mimeType.isEmpty()
                                    ? "*/*"
                                    : document.mimeType
                    )
                    .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
            intent.setClipData(ClipData.newUri(
                    requireContext().getContentResolver(),
                    document.title,
                    uri
            ));'''

          old_share = '''            Intent share = new Intent(Intent.ACTION_SEND)
                    .setType(document.mimeType.isEmpty()
                            ? "*/*"
                            : document.mimeType)
                    .putExtra(Intent.EXTRA_STREAM, uri)
                    .putExtra(Intent.EXTRA_SUBJECT, document.title)
                    .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                    .setClipData(ClipData.newUri(
                            requireContext().getContentResolver(),
                            document.title,
                            uri
                    ));'''
          new_share = '''            Intent share = new Intent(Intent.ACTION_SEND)
                    .setType(document.mimeType.isEmpty()
                            ? "*/*"
                            : document.mimeType)
                    .putExtra(Intent.EXTRA_STREAM, uri)
                    .putExtra(Intent.EXTRA_SUBJECT, document.title)
                    .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
            share.setClipData(ClipData.newUri(
                    requireContext().getContentResolver(),
                    document.title,
                    uri
            ));'''

          if old_open not in text:
              raise SystemExit('Open-document Intent block not found')
          if old_share not in text:
              raise SystemExit('Share-document Intent block not found')

          text = text.replace(old_open, new_open, 1)
          text = text.replace(old_share, new_share, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch to master
        shell: bash
        run: |
          git config user.name "Family Hub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/documents/DocumentsFragment.java
          git commit -m "Fix Documents Vault Intent clip data compatibility"
          git push origin master

      - name: Confirm patch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Documents Vault Intent compatibility patch committed to `master`.'
            });
