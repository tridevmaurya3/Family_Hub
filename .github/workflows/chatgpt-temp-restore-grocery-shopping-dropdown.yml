name: Temporary restore grocery shopping dropdown

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-temp-restore-grocery-shopping-dropdown.yml'

permissions:
  contents: write

jobs:
  patch-grocery-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested grocery overlay patch
        run: python .github/scripts/chatgpt_patch_grocery.py

      - name: Commit source change and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          git rm .github/workflows/chatgpt-temp-restore-grocery-shopping-dropdown.yml
          git rm .github/scripts/chatgpt_patch_grocery.py
          if ! git diff --cached --quiet; then
            git commit -m "Restore grocery radios and refine shopping dropdown"
            git push
          fi
