name: Apply Smart To-Do Due Time Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/task-smart-due-time-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Configure CI Android files
        shell: bash
        run: |
          printf 'sdk.dir=%s\nMAPS_API_KEY=CI_DUMMY_KEY\n' "$ANDROID_HOME" > local.properties
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"family-hub-ci","storage_bucket":"family-hub-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0000000000000000","android_client_info":{"package_name":"com.tridev.familyhub"}},"oauth_client":[],"api_key":[{"current_key":"CI_DUMMY_FIREBASE_API_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON

      - name: Apply patch
        run: python3 tools/apply_task_smart_due_time_patch.py

      - name: Verify scope
        shell: bash
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | grep -Ev '^(app/src/main/java/com/tridev/familyhub/feature/tasks/FamilyTasksFragment.java|app/src/main/java/com/tridev/familyhub/feature/tasks/overlay/FamilyTaskOverlayService.java|app/src/main/res/layout/fragment_family_tasks.xml|app/src/main/res/values/strings_task_time.xml)$' | wc -l)" -eq 0
          ! grep -R "set(Calendar.HOUR_OF_DAY, 18)" app/src/main/java/com/tridev/familyhub/feature/tasks/FamilyTasksFragment.java app/src/main/java/com/tridev/familyhub/feature/tasks/overlay/FamilyTaskOverlayService.java

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Commit app changes
        shell: bash
        run: |
          git config user.name "tridevmaurya3"
          git config user.email "tridevmaurya3@gmail.com"
          git add app/src/main/java/com/tridev/familyhub/feature/tasks/FamilyTasksFragment.java \
                  app/src/main/java/com/tridev/familyhub/feature/tasks/overlay/FamilyTaskOverlayService.java \
                  app/src/main/res/layout/fragment_family_tasks.xml \
                  app/src/main/res/values/strings_task_time.xml
          git commit -m "Add smart date and time controls to Family To-Do"
          git push origin HEAD:main
