name: Patch Grocery Overlay Smart Category

on:
  push:
    paths:
      - '.github/workflows/patch-grocery-overlay-smart-category.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse smart category picker in floating Grocery
        shell: python
        run: |
          from pathlib import Path

          picker_path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/GrocerySmartCategoryPicker.java')
          picker = picker_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          picker = replace_once(
              picker,
              'import android.widget.ScrollView;\nimport android.widget.TextView;\n',
              'import android.widget.ScrollView;\nimport android.widget.Spinner;\nimport android.widget.TextView;\n',
              'spinner import'
          )

          attach_anchor = '''        input.setContentDescription("Choose Grocery category with search, recent and popular categories");\n    }\n\n    private interface SelectionListener {\n'''
          attach_replacement = '''        input.setContentDescription("Choose Grocery category with search, recent and popular categories");\n    }\n\n    public interface CategorySelectionHandler {\n        void onSelected(@NonNull String value);\n    }\n\n    /**\n     * Reuses the same searchable chooser for the system-overlay Grocery Spinner.\n     * The caller keeps ownership of the Spinner adapter and save contract.\n     */\n    public static void attach(@NonNull Context context,\n                              @NonNull Spinner input,\n                              @NonNull CategorySelectionHandler handler) {\n        Runnable open = () -> {\n            Object selected = input.getSelectedItem();\n            String current = selected == null ? "" : selected.toString();\n            if (GroceryOptionCatalog.ADD_CATEGORY_LABEL.equals(current)) current = "";\n            show(context, current, handler::onSelected);\n        };\n        input.setOnTouchListener((view, event) -> {\n            int action = event.getActionMasked();\n            if (action == android.view.MotionEvent.ACTION_DOWN) {\n                view.setPressed(true);\n                return true;\n            }\n            if (action == android.view.MotionEvent.ACTION_UP) {\n                view.setPressed(false);\n                open.run();\n                return true;\n            }\n            if (action == android.view.MotionEvent.ACTION_CANCEL) {\n                view.setPressed(false);\n                return true;\n            }\n            return true;\n        });\n        input.setOnKeyListener((view, keyCode, event) -> {\n            if (event.getAction() != android.view.KeyEvent.ACTION_UP) return false;\n            if (keyCode != android.view.KeyEvent.KEYCODE_ENTER\n                    && keyCode != android.view.KeyEvent.KEYCODE_DPAD_CENTER) return false;\n            open.run();\n            return true;\n        });\n        input.setContentDescription(\n                "Choose Grocery category with search, recent and popular categories");\n    }\n\n    private interface SelectionListener {\n'''
          picker = replace_once(picker, attach_anchor, attach_replacement, 'spinner attach overload')

          picker = replace_once(
              picker,
              '        dialog.show();\n    }\n\n    private static void showAddCategoryDialog',
              '        configureOverlayWindow(context, dialog);\n        dialog.show();\n    }\n\n    private static void showAddCategoryDialog',
              'main picker overlay window'
          )

          add_anchor = '''        new MaterialAlertDialogBuilder(context)\n                .setTitle("Add grocery category")\n                .setView(input)\n                .setNegativeButton(android.R.string.cancel, null)\n                .setPositiveButton("Add", (dialog, which) -> {\n                    String value = input.getText() == null\n                            ? "" : input.getText().toString().trim();\n                    if (!value.isEmpty()) listener.onSelected(value);\n                })\n                .show();\n'''
          add_replacement = '''        AlertDialog addDialog = new MaterialAlertDialogBuilder(context)\n                .setTitle("Add grocery category")\n                .setView(input)\n                .setNegativeButton(android.R.string.cancel, null)\n                .setPositiveButton("Add", (dialog, which) -> {\n                    String value = input.getText() == null\n                            ? "" : input.getText().toString().trim();\n                    if (!value.isEmpty()) listener.onSelected(value);\n                })\n                .create();\n        configureOverlayWindow(context, addDialog);\n        addDialog.show();\n'''
          picker = replace_once(picker, add_anchor, add_replacement, 'add category overlay window')

          dp_anchor = '''    private static int dp(@NonNull Context context, int value) {\n'''
          dp_replacement = '''    private static void configureOverlayWindow(@NonNull Context context,\n                                               @NonNull AlertDialog dialog) {\n        if (!(context instanceof android.app.Service) || dialog.getWindow() == null) return;\n        dialog.getWindow().setType(\n                android.view.WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY);\n    }\n\n    private static int dp(@NonNull Context context, int value) {\n'''
          picker = replace_once(picker, dp_anchor, dp_replacement, 'overlay dialog helper')
          picker_path.write_text(picker, encoding='utf-8')

          service_path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java')
          service = service_path.read_text(encoding='utf-8')
          service = replace_once(
              service,
              'import com.tridev.familyhub.feature.grocery.GroceryRecurrenceEngine;\nimport com.tridev.familyhub.feature.grocery.GroceryOptionCatalog;\n',
              'import com.tridev.familyhub.feature.grocery.GroceryRecurrenceEngine;\nimport com.tridev.familyhub.feature.grocery.GroceryOptionCatalog;\nimport com.tridev.familyhub.feature.grocery.GrocerySmartCategoryPicker;\n',
              'smart category import'
          )
          service = replace_once(
              service,
              '        Spinner category = compactSpinner(categoryChoices);\n        enableCustomCategoryCreation(category, "");\n        Spinner moneyAccount = moneyAccountSpinner();\n',
              '''        Spinner category = compactSpinner(categoryChoices);\n        enableCustomCategoryCreation(category, "");\n        GrocerySmartCategoryPicker.attach(this, category, value -> {\n            String[] updated = GroceryOptionCatalog.categoryLabelsWithAdd(this);\n            category.setAdapter(compactSpinnerAdapter(updated));\n            category.setDropDownWidth(adaptivePopupWidth(updated, 12.5f));\n            selectSpinner(category, updated, value);\n        });\n        Spinner moneyAccount = moneyAccountSpinner();\n''',
              'floating category hook'
          )
          service_path.write_text(service, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/GrocerySmartCategoryPicker.java
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          git commit -m "Add smart categories to floating Grocery"
          git push
