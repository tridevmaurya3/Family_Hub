name: One-shot Grocery Overlay Layout Patch

on:
  push:
    paths:
      - '.github/workflows/zz-one-shot-grocery-overlay-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot grocery overlay layout patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply minimal Grocery overlay layout reorder
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        overlayFormDetails.addView(typeBlock);\n',
                  '        root.addView(typeBlock);\n'
              ),
              (
                  '        overlayFormDetails.addView(detailsThree);\n'
                  '        root.addView(overlayFormDetails);\n\n'
                  '        TextView quickLabel',
                  '        overlayFormDetails.addView(detailsThree);\n\n'
                  '        TextView quickLabel'
              ),
              (
                  '        quickAdd.addView(add, addParams);\n'
                  '        root.addView(quickAdd);\n\n'
                  '        LinearLayout listTools',
                  '        quickAdd.addView(add, addParams);\n'
                  '        root.addView(quickAdd);\n'
                  '        root.addView(overlayFormDetails);\n\n'
                  '        LinearLayout listTools'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit minimal source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          git diff --cached --check
          git commit -m "Reorder grocery overlay quick add below list type"
          git push origin HEAD:main
