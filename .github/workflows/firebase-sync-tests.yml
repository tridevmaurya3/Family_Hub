name: Firebase Family Sync Tests

on:
  push:
    branches: [main]
    paths:
      - database.rules.json
      - tests/firebase/**
      - .github/workflows/firebase-sync-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-module-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-only dependencies
        run: npm --prefix tests/firebase install --ignore-scripts --no-audit --no-fund
      - name: Configure isolated local emulator
        run: |
          node -e "require('fs').writeFileSync('firebase.test.json', JSON.stringify({database:{rules:'database.rules.json'},emulators:{database:{host:'127.0.0.1',port:9000},ui:{enabled:false}}}))"
      - name: Verify realtime delivery and family isolation
        run: tests/firebase/node_modules/.bin/firebase emulators:exec --project demo-familyhub-sync --config firebase.test.json --only database "npm --prefix tests/firebase test"
