name: Patch Grocery Overlay Details

on:
  push:
    paths:
      - '.github/workflows/patch-grocery-overlay-details.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split basic and optional Grocery form fields
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    private LinearLayout overlayFormDetails;\n    private ScrollView overlayItemScroll;\n',
              '    private LinearLayout overlayFormDetails;\n    private LinearLayout overlayOptionalDetails;\n    private ScrollView overlayItemScroll;\n',
              'optional details field'
          )

          replace_once(
              '        overlayFormToggle = compactAction(getString(R.string.grocery_overlay_hide_form),\n',
              '        overlayFormToggle = compactAction("More details  ▾",\n',
              'header details action'
          )

          replace_once(
              '        overlayFormDetails = new LinearLayout(this);\n        overlayFormDetails.setOrientation(LinearLayout.VERTICAL);\n',
              '        overlayFormDetails = new LinearLayout(this);\n        overlayFormDetails.setOrientation(LinearLayout.VERTICAL);\n        overlayOptionalDetails = new LinearLayout(this);\n        overlayOptionalDetails.setOrientation(LinearLayout.VERTICAL);\n',
              'optional details container'
          )

          old_rows = '''        LinearLayout detailsOne = new LinearLayout(this);\n        detailsOne.setOrientation(LinearLayout.HORIZONTAL);\n        addCompactColumn(detailsOne, labelledField(getString(R.string.grocery_quantity_amount), quantity), false);\n        addCompactColumn(detailsOne, labelledField(getString(R.string.grocery_quantity_unit), quantityUnit), true);\n        addCompactColumn(detailsOne, labelledField(getString(R.string.grocery_overlay_price), price), true);\n        overlayFormDetails.addView(detailsOne);\n\n        LinearLayout detailsTwo = new LinearLayout(this);\n        detailsTwo.setOrientation(LinearLayout.HORIZONTAL);\n        addCompactColumn(detailsTwo, labelledField(getString(R.string.grocery_category), category), false);\n        addCompactColumn(detailsTwo, labelledField(getString(R.string.money_manager_paid_from), moneyAccount), true);\n        addCompactColumn(detailsTwo, labelledField(getString(R.string.money_manager_expense_category), moneyCategory), true);\n        overlayFormDetails.addView(detailsTwo);\n        attachLiveMoneyCatalog(moneyAccount, moneyCategory);\n\n        LinearLayout detailsThree = new LinearLayout(this);\n        detailsThree.setOrientation(LinearLayout.HORIZONTAL);\n        addCompactColumn(detailsThree, labelledField(getString(R.string.grocery_priority), priority), false);\n        addCompactColumn(detailsThree, labelledField(getString(R.string.grocery_assign_to), member), true);\n        addCompactColumn(detailsThree, labelledField("Quick pick", quickPick), true);\n        overlayFormDetails.addView(detailsThree);\n'''

          new_rows = '''        LinearLayout basicDetails = new LinearLayout(this);\n        basicDetails.setOrientation(LinearLayout.HORIZONTAL);\n        addCompactColumn(basicDetails, labelledField(getString(R.string.grocery_quantity_amount), quantity), false);\n        addCompactColumn(basicDetails, labelledField(getString(R.string.grocery_quantity_unit), quantityUnit), true);\n        addCompactColumn(basicDetails, labelledField(getString(R.string.grocery_category), category), true);\n        overlayFormDetails.addView(basicDetails);\n\n        LinearLayout optionalMoneyDetails = new LinearLayout(this);\n        optionalMoneyDetails.setOrientation(LinearLayout.HORIZONTAL);\n        addCompactColumn(optionalMoneyDetails, labelledField(getString(R.string.grocery_overlay_price), price), false);\n        addCompactColumn(optionalMoneyDetails, labelledField(getString(R.string.money_manager_paid_from), moneyAccount), true);\n        addCompactColumn(optionalMoneyDetails, labelledField(getString(R.string.money_manager_expense_category), moneyCategory), true);\n        overlayOptionalDetails.addView(optionalMoneyDetails);\n        attachLiveMoneyCatalog(moneyAccount, moneyCategory);\n\n        LinearLayout optionalAssignmentDetails = new LinearLayout(this);\n        optionalAssignmentDetails.setOrientation(LinearLayout.HORIZONTAL);\n        addCompactColumn(optionalAssignmentDetails, labelledField(getString(R.string.grocery_priority), priority), false);\n        addCompactColumn(optionalAssignmentDetails, labelledField(getString(R.string.grocery_assign_to), member), true);\n        addCompactColumn(optionalAssignmentDetails, labelledField("Quick pick", quickPick), true);\n        overlayOptionalDetails.addView(optionalAssignmentDetails);\n        overlayFormDetails.addView(overlayOptionalDetails);\n'''
          replace_once(old_rows, new_rows, 'form field rows')

          replace_once(
              '        if (overlayFormDetails == null || overlayItemScroll == null || overlayFormToggle == null) return;\n',
              '        if (overlayFormDetails == null || overlayOptionalDetails == null\n                || overlayItemScroll == null || overlayFormToggle == null) return;\n',
              'collapse guard'
          )
          replace_once(
              '        overlayFormDetails.setVisibility(collapsed ? View.GONE : View.VISIBLE);\n',
              '        overlayFormDetails.setVisibility(View.VISIBLE);\n        overlayOptionalDetails.setVisibility(collapsed ? View.GONE : View.VISIBLE);\n',
              'optional visibility'
          )
          replace_once(
              '        overlayFormToggle.setText(collapsed ? "Normal" : "Mini");\n',
              '        overlayFormToggle.setText(collapsed ? "More details  ▾" : "Less details  ▴");\n',
              'details toggle label'
          )
          replace_once(
              '                ? "Switch floating Grocery to Normal mode"\n                : "Switch floating Grocery to Mini mode");\n',
              '                ? "Show more Grocery details"\n                : "Hide extra Grocery details");\n',
              'details accessibility label'
          )

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          git commit -m "Add finer Grocery overlay more details form"
          git push
