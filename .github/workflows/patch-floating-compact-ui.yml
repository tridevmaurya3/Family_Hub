name: Patch Floating Compact UI

on:
  push:
    paths:
      - '.github/workflows/patch-floating-compact-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final compact UI polish
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          picker_path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/GrocerySmartCategoryPicker.java')
          picker = picker_path.read_text(encoding='utf-8')
          picker = replace_once(picker,
              '''        root.setPadding(side, gap, side, side);\n''',
              '''        root.setPadding(side, gap, side, dp(context, 8));\n        root.setBackground(roundedBackground(\n                Color.rgb(250, 252, 253), Color.rgb(215, 226, 230), dp(context, 18)));\n''',
              'picker card background')
          picker = replace_once(picker,
              '''        search.setTextSize(13f);\n        search.setHint("Search category");\n        search.setPadding(dp(context, 12), 0, dp(context, 12), 0);\n''',
              '''        search.setTextSize(12f);\n        search.setHint("Search category");\n        search.setBackground(roundedBackground(\n                Color.WHITE, Color.rgb(196, 215, 220), dp(context, 12)));\n        search.setPadding(dp(context, 11), 0, dp(context, 11), 0);\n''',
              'picker search style')
          picker = replace_once(picker,
              '''        status.setTextSize(11f);\n        status.setTextColor(Color.rgb(94, 104, 114));\n        status.setPadding(dp(context, 4), dp(context, 6), dp(context, 4), 0);\n''',
              '''        status.setTextSize(9.5f);\n        status.setTextColor(Color.rgb(94, 104, 114));\n        status.setPadding(dp(context, 3), dp(context, 3), dp(context, 3), 0);\n''',
              'picker status compact')
          picker = replace_once(picker,
              '''            row.setBackgroundTintList(android.content.res.ColorStateList.valueOf(\n                    selected ? Color.rgb(229, 247, 239) : Color.WHITE));\n''',
              '''            row.setBackgroundTintList(android.content.res.ColorStateList.valueOf(\n                    selected ? Color.rgb(229, 247, 239) : Color.rgb(241, 248, 252)));\n''',
              'picker dropdown row tint')
          picker = replace_once(picker,
              '''    private static int dp(@NonNull Context context, int value) {\n        return Math.round(value * context.getResources().getDisplayMetrics().density);\n    }\n''',
              '''    @NonNull\n    private static android.graphics.drawable.GradientDrawable roundedBackground(\n            int fill, int stroke, int radiusPx) {\n        android.graphics.drawable.GradientDrawable drawable =\n                new android.graphics.drawable.GradientDrawable();\n        drawable.setColor(fill);\n        drawable.setCornerRadius(radiusPx);\n        drawable.setStroke(1, stroke);\n        return drawable;\n    }\n\n    private static int dp(@NonNull Context context, int value) {\n        return Math.round(value * context.getResources().getDisplayMetrics().density);\n    }\n''',
              'picker rounded helper')
          picker_path.write_text(picker, encoding='utf-8')

          overlay_path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java')
          overlay = overlay_path.read_text(encoding='utf-8')
          overlay = replace_once(overlay,
              '''        LinearLayout.LayoutParams liveStatusParams =\n                new LinearLayout.LayoutParams(dp(48), dp(20));\n        subtitleRow.addView(overlayLiveStatus, liveStatusParams);\n        subtitleRow.addView(shoppingSubtitle,\n                new LinearLayout.LayoutParams(0, dp(20), 1f));\n''',
              '''        LinearLayout.LayoutParams liveStatusParams = new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.WRAP_CONTENT, dp(20));\n        liveStatusParams.setMarginEnd(dp(7));\n        subtitleRow.addView(overlayLiveStatus, liveStatusParams);\n        subtitleRow.addView(shoppingSubtitle,\n                new LinearLayout.LayoutParams(0, dp(20), 1f));\n''',
              'overlay live adaptive width')
          overlay = replace_once(overlay,
              '''        LinearLayout.LayoutParams screenOnParams = new LinearLayout.LayoutParams(dp(42), dp(20));\n        screenOnParams.setMarginStart(dp(3));\n        subtitleRow.addView(screenOn, screenOnParams);\n        titleStack.addView(subtitleRow, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(20)));\n\n        header.addView(titleStack, new LinearLayout.LayoutParams(0, dp(48), 1f));\n''',
              '''        LinearLayout.LayoutParams screenOnParams = new LinearLayout.LayoutParams(dp(54), dp(20));\n        screenOnParams.setMarginStart(dp(4));\n        subtitleRow.addView(screenOn, screenOnParams);\n\n        header.addView(titleStack, new LinearLayout.LayoutParams(0, dp(40), 1f));\n''',
              'overlay detach subtitle')
          overlay = replace_once(overlay,
              '''        root.addView(header, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(50)));\n\n        overlayFormDetails = new LinearLayout(this);\n''',
              '''        root.addView(header, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(42)));\n        LinearLayout.LayoutParams subtitleStripParams = new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(22));\n        subtitleStripParams.bottomMargin = dp(1);\n        root.addView(subtitleRow, subtitleStripParams);\n\n        overlayFormDetails = new LinearLayout(this);\n''',
              'overlay full width subtitle strip')
          overlay_path.write_text(overlay, encoding='utf-8')

      - name: Commit compact UI polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/GrocerySmartCategoryPicker.java
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          git commit -m "Polish floating Grocery compact layout"
          git push