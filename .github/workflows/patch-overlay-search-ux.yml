name: Patch Floating Grocery Search UX

on:
  push:
    paths:
      - '.github/workflows/patch-overlay-search-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compile-safe label size
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java')
          text = path.read_text(encoding='utf-8')
          old = '        overlaySearchStatus = text("", 9.5f, true);\n'
          new = '        overlaySearchStatus = text("", 9, true);\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one result-label anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit compile-safe polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tridev/familyhub/feature/grocery/overlay/GroceryOverlayService.java
          git commit -m "Fix floating Grocery search result label size"
          git push